[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vedic-astro"
version = "0.1.0"
description = "Local, offline Vedic astrology chart engine (South Indian style) with a single-screen web UI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "pyswisseph>=2.10.3.2",
    "pydantic>=2.7",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "geonamescache>=2.0",
    "timezonefinder>=6.5",
    "tzdata>=2024.1",
    "reverse_geocoder>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vedic_astro"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["swisseph", "geonamescache", "timezonefinder", "reverse_geocoder"]
ignore_missing_imports = true
