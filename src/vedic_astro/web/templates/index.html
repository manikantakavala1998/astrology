<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080f20">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}Vedic Astro · Your cosmic blueprint{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/star.svg">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/ui/app.css">
</head>
<body>
  <div id="astro-root">
    {% block workspace %}{% include "_workspace.html" %}{% endblock %}
  </div>
  <script id="astro-state" type="application/json">{{ frontend_state | tojson }}</script>
  <script type="module" src="/static/ui/app.js"></script>
</body>
</html>
